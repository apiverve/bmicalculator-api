openapi: 3.0.4
info:
  title: BMI Calculator
  description: >-
    BMI Calculator computes Body Mass Index along with ideal weight ranges, BMR
    (Basal Metabolic Rate), TDEE (Total Daily Energy Expenditure), calorie
    targets, and macronutrient recommendations for fitness and health
    applications.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/bmicalculator:
    get:
      summary: BMI Calculator
      description: Calculate BMI, ideal weight, BMR, TDEE, calorie targets and macros
      operationId: bmicalculator
      parameters:
        - name: weight
          in: query
          schema:
            type: number
          required: true
          description: Weight in kg (metric) or lbs (imperial)
          example: 180
        - name: height
          in: query
          schema:
            type: number
          required: true
          description: Height in cm (metric) or inches (imperial)
          example: 70
        - name: unit
          in: query
          schema:
            type: string
          required: true
          description: Unit system for weight and height
          example: imperial
        - name: age
          in: query
          schema:
            type: number
          required: false
          description: Age in years (required for BMR/TDEE calculations)
          example: 30
        - name: gender
          in: query
          schema:
            type: string
          required: false
          description: Gender (required for BMR/TDEE calculations)
          example: male
        - name: activityLevel
          in: query
          schema:
            type: string
          required: false
          description: Activity level (required for TDEE/calorie calculations)
          example: moderate
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  height: 70 inches
                  weight: 180 lbs
                  bmi: 25.83
                  bmiPrime: 1.033
                  category: Overweight
                  risk: Increased risk
                  summary: >-
                    BMI is above the healthy range. Lifestyle changes may be
                    beneficial.
                  idealWeightRange:
                    min: 129
                    max: 173.5
                    unit: lbs
                  weightToChange:
                    direction: lose
                    amount: 6.5
                    unit: lbs
                  bmr: 1783
                  tdee: 2763
                  calorieTargets:
                    extremeDeficit: 1763
                    moderateDeficit: 2263
                    maintain: 2763
                    moderateSurplus: 3063
                    bulkSurplus: 3263
                  macros:
                    lose:
                      protein: 198
                      carbs: 198
                      fat: 75
                    maintain:
                      protein: 207
                      carbs: 276
                      fat: 92
                    gain:
                      protein: 230
                      carbs: 345
                      fat: 85
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
