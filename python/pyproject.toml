[project]
name = "apiverve-bmicalculator"
version = "1.2.6"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "BMI Calculator is a BMI API that computes Body Mass Index, its category and the healthy weight range for a given height, plus BMR (Basal Metabolic Rate), TDEE (Total Daily Energy Expenditure), calorie targets and macronutrient recommendations for fitness and health applications."
keywords = ["bmi calculator", "bmi api", "bmr calculator", "tdee calculator", "basal metabolic rate"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/bmicalculator?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/bmicalculator?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/bmicalculator-api"
Twitter = "https://twitter.com/apivervehq"
